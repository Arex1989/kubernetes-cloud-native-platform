apiVersion: apps/v1
kind: Deployment
metadata:
  name: platform-api
  namespace: project4
  labels:
    app: cloud-native-platform-api
    phase: fundamentals
spec:
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  replicas: 2

  selector:
    matchLabels:
      app: cloud-native-platform-api
      managed-by: deployment

  template:
    metadata:
      labels:
        app: cloud-native-platform-api
        managed-by: deployment
        phase: fundamentals

    spec:
      containers:
        - name: platform-api
          image: cloud-native-platform-api:2.0.0
          imagePullPolicy: IfNotPresent

          envFrom:
            - configMapRef:
                name: platform-api-environment-config



          env:
            - name: API_USERNAME
              valueFrom:
                secretKeyRef:
                  name: platform-api-secret
                  key: API_USERNAME
            - name: API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: platform-api-secret
                  key: API_TOKEN
          volumeMounts:
            - name: platform-config-volume
              mountPath: /etc/platform
              readOnly: true

          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 12

          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3

          readinessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3

          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi

          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
      volumes:
        - name: platform-config-volume
          configMap:
            name: platform-api-file-config
