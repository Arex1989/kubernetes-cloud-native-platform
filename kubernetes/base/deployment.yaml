apiVersion: apps/v1
kind: Deployment
metadata:
  name: platform-api
  namespace: project4
  labels:
    app: cloud-native-platform-api
    phase: fundamentals
spec:
  replicas: 2

  selector:
    matchLabels:
      app: cloud-native-platform-api
      managed-by: deployment

  template:
    metadata:
      labels:
        app: cloud-native-platform-api
        managed-by: deployment
        phase: fundamentals

    spec:
      containers:
        - name: platform-api
          image: cloud-native-platform-api:2.0.0
          imagePullPolicy: IfNotPresent

          envFrom:
            - configMapRef:
                name: platform-api-environment-config



          env:
            - name: API_USERNAME
              valueFrom:
                secretKeyRef:
                  name: platform-api-secret
                  key: API_USERNAME
            - name: API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: platform-api-secret
                  key: API_TOKEN
          volumeMounts:
            - name: platform-config-volume
              mountPath: /etc/platform
              readOnly: true

          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
      volumes:
        - name: platform-config-volume
          configMap:
            name: platform-api-file-config
