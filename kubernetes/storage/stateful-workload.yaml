apiVersion: apps/v1
kind: Deployment
metadata:
  name: persistent-worker
  namespace: project4
  labels:
    app: persistent-worker
    phase: storage
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: persistent-worker
  template:
    metadata:
      labels:
        app: persistent-worker
        phase: storage
    spec:
      containers:
        - name: persistent-worker
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              echo "Persistent workload started."
              while true; do
                date -u +"%Y-%m-%dT%H:%M:%SZ" >> /data/heartbeat.log
                sleep 30
              done
          volumeMounts:
            - name: persistent-data
              mountPath: /data
      volumes:
        - name: persistent-data
          persistentVolumeClaim:
            claimName: platform-data
