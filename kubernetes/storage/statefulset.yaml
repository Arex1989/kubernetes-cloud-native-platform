apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: stateful-worker
  namespace: project4
  labels:
    app: stateful-worker
    phase: storage
spec:
  serviceName: stateful-worker
  replicas: 2
  podManagementPolicy: OrderedReady
  selector:
    matchLabels:
      app: stateful-worker
  template:
    metadata:
      labels:
        app: stateful-worker
        phase: storage
    spec:
      containers:
        - name: stateful-worker
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              echo "StatefulSet worker started."
              echo "$(hostname)" > /data/pod-identity.txt
              while true; do
                date -u +"%Y-%m-%dT%H:%M:%SZ" >> /data/heartbeat.log
                sleep 30
              done
          volumeMounts:
            - name: stateful-data
              mountPath: /data
  volumeClaimTemplates:
    - metadata:
        name: stateful-data
        labels:
          app: stateful-worker
          phase: storage
      spec:
        accessModes:
          - ReadWriteOnce
        storageClassName: standard
        resources:
          requests:
            storage: 1Gi
